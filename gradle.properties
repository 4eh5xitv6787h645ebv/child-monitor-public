# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# NOTE on JDK: this project builds with JDK 17 (CI provides Temurin 17 via
# setup-java). Do NOT commit org.gradle.java.home here — it is a machine-local
# absolute path and kills every CI run at Gradle startup (#197). If your system
# JDK is newer than the pinned Gradle supports, pin the path in your user-level
# ~/.gradle/gradle.properties instead (user-level takes precedence anyway).

# JVM args for the Gradle daemon. 4 GB heap covers big Kotlin compiles
# (this machine has 32 GB). G1 GC keeps pauses small. UTF-8 keeps source
# encoding deterministic.
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8

# Build performance toggles.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=true

# Kotlin compile performance. Classpath snapshots make incremental Kotlin
# rebuilds skip far more work when only ABI-stable changes happen elsewhere.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2g -Xms512m -XX:+UseG1GC

# AndroidX + Jetifier off (we have no legacy support-library deps).
android.enableJetifier=false
android.nonTransitiveRClass=true
android.useAndroidX=true

# Keep both debug and release unit-test components. Security/session tests intentionally run against
# release BuildConfig semantics; AGP 9 otherwise creates only the Studio-selected debug suite.
android.onlyEnableUnitTestForTheTestedBuildType=false
