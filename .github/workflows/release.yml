name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify, sign, and publish
    if: vars.CM_RELEASE_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Restore release identity from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CM_RELEASE_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo 'A required CM_RELEASE_* repository secret is missing' >&2
              exit 1
            fi
          done
          keystore_path=$RUNNER_TEMP/child-monitor-release.p12
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "CM_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "CM_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CM_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CM_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Lint and test the release
        run: ./gradlew lintRelease testReleaseUnitTest --no-daemon --stacktrace
      - name: Prove the signed APK is reproducible
        env:
          CM_GRADLE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify-reproducible-release.sh
      - name: Generate the release SBOM
        run: ./gradlew :app:cyclonedxDirectBom --no-daemon --stacktrace
      - name: Verify version and approved signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ ! -x "$aapt_bin" ]; then
            echo 'Android aapt executable not found' >&2
            exit 1
          fi
          version=$($aapt_bin dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match APK version v$version" >&2
            exit 1
          fi
          scripts/verify-release-signing.sh "$apk" security/release-signing-cert.sha256
      - name: Run Android-specific static analysis
        env:
          REPORT_DIRECTORY: app/build/reports/security
        run: mkdir -p "$REPORT_DIRECTORY"
      - name: Generate Android SAST evidence
        uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353 # v0.4.5
        with:
          args: app/src/main --type android --config security/mobsfscan.yml --sarif -o app/build/reports/security/mobsfscan.sarif
      - name: Fail on actionable SAST findings
        run: jq -e '[.runs[]?.results[]? | select(.level == "error")] | length == 0' app/build/reports/security/mobsfscan.sarif >/dev/null
      - name: Install checksum-verified release security tools
        run: |
          mkdir -p app/build/security-tools app/build/reports/security app/build/release-evidence
          curl -fsSL --retry 3 -o app/build/security-tools/cyclonedx https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64
          echo '454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  app/build/security-tools/cyclonedx' | sha256sum -c -
          curl -fsSL --retry 3 -o app/build/security-tools/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          echo 'bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  app/build/security-tools/osv-scanner' | sha256sum -c -
          archive=app/build/security-tools/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  app/build/security-tools/gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf "$archive" -C app/build/security-tools gitleaks
          chmod +x app/build/security-tools/cyclonedx app/build/security-tools/osv-scanner
      - name: Validate dependencies, licenses, and repository history
        run: |
          sbom=app/build/reports/sbom/child-monitor-${GITHUB_REF_NAME#v}.cdx.json
          app/build/security-tools/cyclonedx validate --input-file "$sbom" --input-format json --input-version v1_6 --fail-on-errors
          scripts/generate-license-report.sh "$sbom" security/license-policy.json "app/build/reports/sbom/licenses-${GITHUB_REF_NAME#v}.tsv"
          app/build/security-tools/osv-scanner scan source --lockfile=app/gradle.lockfile --format json --output-file app/build/reports/security/osv-release.json
          app/build/security-tools/gitleaks git --redact --report-format sarif --report-path app/build/reports/security/gitleaks.sarif --no-banner
      - name: Prove the vulnerability gate remains effective
        run: |
          set +e
          app/build/security-tools/osv-scanner scan source --lockfile=security/fixtures/log4shell/gradle.lockfile --format json --output-file app/build/reports/security/osv-gate-fixture.json
          fixture_status=$?
          set -e
          if [ "$fixture_status" -eq 0 ]; then
            echo 'OSV gate failed to reject the deliberately vulnerable fixture' >&2
            exit 1
          fi
          jq -e '[.results[]?.packages[]?.vulnerabilities[]?] | length > 0' app/build/reports/security/osv-gate-fixture.json >/dev/null
      - name: Assemble immutable release evidence
        run: |
          version=${GITHUB_REF_NAME#v}
          install -m 0644 app/build/outputs/apk/release/app-release.apk "app/build/release-evidence/child-monitor-$version.apk"
          install -m 0644 "app/build/reports/sbom/child-monitor-$version.cdx.json" app/build/release-evidence/
          install -m 0644 "app/build/reports/sbom/licenses-$version.tsv" app/build/release-evidence/
          install -m 0644 app/build/reports/security/*.json app/build/reports/security/*.sarif app/build/release-evidence/
          (cd app/build/release-evidence && sha256sum * > SHA256SUMS)
      - name: Upload verified workflow evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ github.ref_name }}-evidence
          path: app/build/release-evidence/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/release-evidence/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
