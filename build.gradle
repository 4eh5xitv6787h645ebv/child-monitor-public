plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'org.cyclonedx.bom' version '3.5.1' apply false
}

allprojects {
    dependencyLocking {
        // Commit resolved versions so Dependabot/OSV inspect the exact graph CI and releases use.
        lockAllConfigurations()
    }
}
